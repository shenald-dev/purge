[project]
name = "purge-reaper"
version = "2.0.0"
description = "🧹 Zero-latency developer bloat and zombie process reaper. Reclaim 50GB in 3 seconds."
readme = "README.md"
authors = [
    { name = "Shenal Diluksha", email = "shenald@users.noreply.github.com" }
]
maintainers = [
    { name = "shenald-dev", email = "shenald@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["purge", "cleaner", "node_modules", "zombie-processes", "disk-space", "developer-tools", "tui", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.12.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
purge = "purge.cli:main"

[project.urls]
Homepage = "https://github.com/shenald-dev/purge"
Documentation = "https://github.com/shenald-dev/purge#readme"
Repository = "https://github.com/shenald-dev/purge"
Issues = "https://github.com/shenald-dev/purge/issues"
Changelog = "https://github.com/shenald-dev/purge/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
